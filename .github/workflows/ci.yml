name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test -- --maxWorkers=1
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      # shortcut: development findings are advisory-only; revisit when picomatch has a patched release.
      - name: Report all dependency vulnerabilities
        run: npm audit --audit-level=high
        continue-on-error: true
      - run: npm run build
        env:
          API_URL: https://landing-optimizer-api-505424813528.southamerica-east1.run.app/v1

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: RodrigoVanzelotti/personal-cloud-infrastructure/.github/workflows/deploy-landing-optimizer.yml@main
    with:
      component: dashboard
